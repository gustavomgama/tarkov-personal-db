name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Security scanning ──────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Brakeman (static security analysis)
        run: bin/brakeman --no-pager --exit-on-warn

      - name: Bundler-audit (known gem vulnerabilities)
        run: bin/bundler-audit

  # ── Linting ────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Rubocop
        run: bin/rubocop -f github

  # ── Tests ──────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

  # ── Coverage gate (100% line coverage enforced) ────────────────────
  coverage:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run tests with coverage
        run: bin/rails test

      - name: Enforce 100% line coverage
        run: |
          COVERAGE=$(python3 -c "import json; d=json.load(open('coverage/coverage.json')); print(d['total']['lines']['percent'])")
          echo "Line coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 100" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage is ${COVERAGE}% — requires 100%"
            exit 1
          fi

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Code quality (rubycritic) ──────────────────────────────────────
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.6
          bundler-cache: true

      - name: Install rubycritic
        run: gem install rubycritic

      - name: Run rubycritic
        run: |
          rubycritic --no-browser --format json app/
          cp tmp/rubycritic/report.json /tmp/rubycritic.json

      - name: Enforce score ≥ 75
        run: |
          SCORE=$(python3 -c "import json; d=json.load(open('/tmp/rubycritic.json')); print(d.get('score','0'))")
          echo "Rubycritic score: $SCORE"
          if [ "$(echo "$SCORE < 75" | bc -l)" -eq 1 ]; then
            echo "::error::Rubycritic score $SCORE is below 75 threshold"
            exit 1
          fi

      - name: Summarize
        if: always()
        run: |
          SCORE=$(python3 -c "import json; d=json.load(open('/tmp/rubycritic.json')); print(d.get('score','?'))" 2>/dev/null || echo "?")
          echo "## Rubycritic: $SCORE / 100" >> $GITHUB_STEP_SUMMARY

  # ── Merge gate ─────────────────────────────────────────────────────
  gate:
    if: always()
    needs: [security, lint, test, coverage, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          for job in security lint test coverage; do
            if [ "${{ needs[job].result }}" != "success" ]; then
              echo "::error::$job ${{ needs[job].result }}"
              FAILED=1
            fi
          done
          # audit only runs on PRs; "skipped" is acceptable on push
          AUDIT="${{ needs.audit.result }}"
          if [ "$AUDIT" != "success" ] && [ "$AUDIT" != "skipped" ]; then
            echo "::error::audit $AUDIT"
            FAILED=1
          fi
          if [ "${FAILED:-0}" = "1" ]; then
            echo ""
            echo "Results:"
            echo "  security: ${{ needs.security.result }}"
            echo "  lint:     ${{ needs.lint.result }}"
            echo "  test:     ${{ needs.test.result }}"
            echo "  coverage: ${{ needs.coverage.result }}"
            echo "  audit:    ${{ needs.audit.result }}"
            exit 1
          fi
          echo "All checks passed"
